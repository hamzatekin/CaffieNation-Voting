<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b1a12">
  <title>CaffieNation · Admin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body class="results-page">
  <header class="results-hero">
    <div class="results-hero-content">
      <p class="eyebrow">CaffieNation · Admin</p>
      <h1 id="title">Results</h1>
      <div class="machine-tabs" id="tabs"></div>
    </div>
  </header>

  <main class="results-main">
    <form class="card login" id="login" hidden>
      <div class="card-body">
        <h2>Admin login</h2>
        <p class="question">Enter the admin password to see the votes.</p>
        <div class="inline-form">
          <input id="password" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password">
          <button class="btn btn-primary" type="submit">Open</button>
        </div>
        <p class="error" id="login-error" hidden></p>
      </div>
    </form>

    <div id="dashboard" hidden>
      <p class="empty" id="message" hidden></p>

      <div id="results" hidden>
        <section class="card results-card">
          <div class="card-body">
            <h2>Summary</h2>
            <table class="summary-table"><tbody id="summary"></tbody></table>
          </div>
        </section>

        <section class="card results-card">
          <div class="card-body">
            <div class="votes-head">
              <h2>All votes</h2>
              <button class="btn btn-ghost btn-small" id="csv" type="button">Download CSV</button>
            </div>
            <div class="table-wrap">
              <table class="votes-table">
                <thead><tr><th></th><th>Time (UTC)</th><th>☕</th><th>🥛</th><th>👆</th><th>⚡</th><th>🧼</th><th>❤️</th><th>Happy?</th><th>Beans</th><th>Comment</th></tr></thead>
                <tbody id="votes"></tbody>
              </table>
            </div>
            <p class="hint">– means "didn't try / don't know". Times are UTC.</p>
          </div>
        </section>
      </div>

      <button class="btn btn-ghost btn-small logout" id="logout" type="button">Log out</button>
    </div>
  </main>

  <script src="machines.js?v=4"></script>
  <script src="admin.js?v=4"></script>
</body>
</html>
